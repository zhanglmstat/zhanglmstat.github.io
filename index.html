<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的静态博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, sans-serif;
            max-width: 820px;
            margin: 48px auto;
            padding: 0 20px;
            color: #222;
            line-height: 1.7;
            background-color: #fdfdfd;
        }
        header {
            border-bottom: 1px solid #e5e7eb;
            padding-bottom: 24px;
            margin-bottom: 32px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }
        .post-card {
            background: #f3f4f6;
            padding: 24px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .post-card h2 {
            font-size: 22px;
            margin-bottom: 10px;
        }
        footer {
            margin-top: 60px;
            padding-top: 20px;
            border-top: 1px solid #e5e7eb;
            color: #6b7280;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>我的博客</h1>
        <p>记录学习笔记与想法</p>
    </header>

    <div class="post-card">
        <h2>第一篇文章</h2>
        <p>欢迎访问我的GitHub Pages静态博客。这里全部由原生HTML编写，免费托管。</p>
    </div>

    <div class="post-card">
        <h2>搭建记录</h2>
        <p>使用GitHub Pages托管静态页面，不需要服务器，直接通过浏览器访问。</p>
    </div>

    <footer>
        © 2026 zhanglmmath | Powered by GitHub Pages
    </footer>
</body>
</html>
